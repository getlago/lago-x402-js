name: publish

# Triggered when a v*.*.* tag is pushed. Once RELEASING.md's one-time setup is
# done, releasing is:
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
#   verify   the repository is public, and the tag names package.json's
#            X.Y.Z version and a commit on main
#   ci       the full CI matrix (ci.yml)
#   build    builds and packs the tarball once, with no dependency install
#            script and every dependency's registry signature checked
#   publish  publishes that tarball to npm with provenance, through npm trusted
#            publishing (OIDC, no token), behind the protected `npm`
#            environment; it checks out no code and installs nothing
#   release  creates the GitHub release with the same tarball attached
#
# Actions are pinned to full commit SHAs (not tags), so a hijacked or
# re-pointed tag can't inject code into a job that mints OIDC tokens. The
# trailing comment is the version each SHA was released as; Dependabot keeps
# both fresh. RELEASING.md explains each choice.

on:
  push:
    tags:
      - "v*.*.*"

# Nothing by default; each job asks for what it needs.
permissions: {}

# No job of a release reads or writes the GitHub Actions cache, so a poisoned
# cache can't reach what is published. GitHub enforces it, including for the
# jobs of the called ci.yml; their cache steps log a miss and carry on.
cache-mode: none

# Runs for the same tag never overlap, and one in progress is never cancelled:
# a cancelled run could stop between the npm publish and the GitHub release.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------
  # 1. The release can be attested, and the tag is a release of reviewed
  #    code: it names package.json's X.Y.Z version, and the commit it
  #    points at is on main.
  # ----------------------------------------------------------------------
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch's history, so origin/main is there to check against.
          fetch-depth: 0
          persist-credentials: false
      # npm attests only packages from a public repository, and the publish
      # job passes --provenance, so it would fail anyway. Checked here, before
      # anything is signed: npm writes the run's provenance (repository,
      # commit, workflow, run) to the public sigstore log before the registry
      # refuses the upload.
      - name: Repository is public
        run: |
          VISIBILITY=$(jq -r .repository.visibility "$GITHUB_EVENT_PATH")
          if [ "$VISIBILITY" != public ]; then
            echo "::error::the repository is $VISIBILITY: npm attaches provenance only to packages from a public repository"
            exit 1
          fi
      - name: Tag matches package.json's version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME (=$TAG) != package.json version $PKG"
            exit 1
          fi
          # A prerelease (X.Y.Z-rc.1) needs its own npm dist-tag, which npm
          # refuses to guess; this workflow publishes X.Y.Z to `latest` only.
          if ! [[ "$PKG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$PKG is not a plain X.Y.Z version: this workflow publishes to npm's latest tag only"
            exit 1
          fi
          echo "Tag $TAG matches package.json version $PKG"
      - name: Tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
          echo "$GITHUB_SHA is on main"

  # ----------------------------------------------------------------------
  # 2. The full CI gate, the same workflow pushes and pull requests run.
  # ----------------------------------------------------------------------
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ----------------------------------------------------------------------
  # 3. Build and pack the tarball once. It is the exact file npm publishes
  #    and the GitHub release attaches.
  # ----------------------------------------------------------------------
  build:
    name: build
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Never cache in release builds (on top of cache-mode: none).
          package-manager-cache: false
      # No dependency's install script runs in the job that builds what is
      # published (the build is tsc only), and every installed package must
      # carry a valid npm registry signature (and attestation, where it has one).
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run build
      - name: Pack tarball
        run: |
          npm pack --ignore-scripts
          {
            echo '```'
            sha256sum ./*.tgz
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error

  # ----------------------------------------------------------------------
  # 4. Publish that tarball to npm through trusted publishing (OIDC), with a
  #    provenance attestation of this run. The only job that can mint an
  #    OIDC token, so it runs no repository or dependency code at all.
  # ----------------------------------------------------------------------
  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Defense-in-depth: only ever publish from a v*.*.* tag ref, even if the
    # environment's tag rule is removed or misconfigured in the UI.
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: npm
      url: https://www.npmjs.com/package/lago-x402
    permissions:
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14; Node 24
      # bundles npm 11. registry-url writes the .npmrc npm publishes through.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download tarball artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package/
      # npm reads the package from the tarball, so nothing is checked out,
      # installed or built here. Provenance attests the tarball's own digest,
      # so it holds for a tarball packed by another job of this run.
      # --provenance is explicit: npm only attests packages from a public
      # repository, and without the flag it would publish without one;
      # with it, the publish fails instead.
      - name: Publish
        run: |
          shopt -s nullglob
          tarballs=(package/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected one tarball in the artifact, found ${#tarballs[@]}"
            exit 1
          fi
          npm publish "./${tarballs[0]}" --provenance --access public

  # ----------------------------------------------------------------------
  # 5. GitHub release for the tag, attaching the tarball npm now serves.
  # ----------------------------------------------------------------------
  release:
    name: github release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package/
      # No checkout: gh works from the API. --verify-tag refuses to create the
      # tag if it isn't already on GitHub.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" package/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
