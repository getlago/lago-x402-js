version: 2

updates:
  # Keep the GitHub Actions in our workflows up to date. We pin every action to a
  # full commit SHA for supply-chain safety (see .github/workflows/publish.yml),
  # which means SHAs don't auto-update — Dependabot opens PRs that bump the SHA
  # and the trailing version comment together, so the pins stay both fixed and
  # fresh (and pick up upstream security patches).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Dev dependencies only: the toolchain, the frameworks the adapters are tested
  # against, and the official x402 clients the tests drive. The runtime
  # dependency (@x402/core) and the peer ranges are changed by hand, with a
  # CHANGELOG entry; security updates for them come from the repository's
  # Dependabot security updates setting, not from this file.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "development"
    # Never propose a release younger than a week.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Typed against the oldest supported Node (engines: >=22.12).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The Express 4 test alias (npm:express@^4) must stay on Express 4.
      - dependency-name: "express4"
        update-types: ["version-update:semver-major"]
