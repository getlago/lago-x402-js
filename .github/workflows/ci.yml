name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release gate: publish.yml calls this workflow, so a release passes
  # exactly what CI runs. Its cache-mode: none also applies here, so a release
  # run reads no cache.
  workflow_call:

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  test:
    name: ${{ matrix.os }} · node${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package check (npm pack, require() from CommonJS, import() from ESM)
        run: npm run test:package

      - name: Unit tests
        run: npm test

  floor:
    # The oldest Node that `engines` promises (keep it in step with package.json):
    # the package as npm would publish it, loaded with require() and import().
    # Lint and the unit tests need the newer Node in `devEngines` (eslint, and
    # undici for the network guard), so the matrix above runs them.
    name: package · ubuntu-latest · node22.12.0
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package check (npm pack, require() from CommonJS, import() from ESM)
        run: npm run test:package

  next:
    # lago-x402/next in a real Next.js app: `next build && next start` against the fake Lago.
    name: next · ubuntu-latest · node22
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Next.js integration
        run: npm run test:next
